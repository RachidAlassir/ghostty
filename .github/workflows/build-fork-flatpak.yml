on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs: {}

name: Build Fork Flatpak

permissions:
  contents: read

jobs:
  build-flatpak:
    name: Build Linux Flatpak (x86_64)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-47
      options: --privileged
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          bundle: ghostty-rtl.flatpak
          manifest-path: flatpak/com.mitchellh.ghostty.yml
          cache-key: flatpak-builder-${{ github.sha }}
          arch: x86_64
          artifact-name: ghostty-rtl-flatpak-x86_64
          verbose: true
